<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CDSCO Dossier Builder - Non-Linear System Block Diagram (SBD)</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #0b0f19;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      user-select: none;
    }
    header {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 60px;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid #1e293b;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      z-index: 100;
    }
    .title-group h1 {
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 0.5px;
      color: #f8fafc;
    }
    .title-group p {
      font-size: 12px;
      color: #94a3b8;
    }
    .toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .btn {
      background: #1e293b;
      color: #f1f5f9;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: background 0.15s, border-color 0.15s;
    }
    .btn:hover {
      background: #334155;
      border-color: #475569;
    }
    .btn:active {
      background: #0f172a;
    }
    .zoom-level {
      font-size: 12px;
      color: #94a3b8;
      min-width: 48px;
      text-align: center;
    }
    #viewport-container {
      width: 100vw;
      height: 100vh;
      cursor: grab;
      position: relative;
    }
    #viewport-container:active {
      cursor: grabbing;
    }
    svg {
      width: 100%;
      height: 100%;
      display: block;
    }
    .block-header {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    .block-sub {
      font-size: 10px;
      font-weight: 500;
      opacity: 0.75;
    }
    .node-text {
      font-size: 11px;
      font-weight: 500;
      fill: #f8fafc;
      text-anchor: middle;
      dominant-baseline: central;
    }
    .node-subtext {
      font-size: 9px;
      fill: #94a3b8;
      text-anchor: middle;
      dominant-baseline: central;
    }
    .footer-help {
      position: absolute;
      bottom: 16px;
      left: 24px;
      font-size: 12px;
      color: #64748b;
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(6px);
      padding: 6px 14px;
      border-radius: 6px;
      border: 1px solid #1e293b;
      pointer-events: none;
    }
  </style>
</head>

  <div class="footer-help">
    Use mouse wheel to zoom &bull; Click &amp; drag to pan &bull; Zero dependencies (Works offline)
  </div>

  <script>
    const container = document.getElementById('viewport-container');
    const svg = document.getElementById('svg-canvas');
    const transformGroup = document.getElementById('transform-group');
    const zoomText = document.getElementById('zoom-text');

    let scale = 1;
    let translateX = 0;
    let translateY = 0;
    let isPanning = false;
    let startX = 0;
    let startY = 0;

    function updateTransform() {
      transformGroup.setAttribute('transform', `translate(${translateX}, ${translateY}) scale(${scale})`);
      zoomText.textContent = Math.round(scale * 100) + '%';
    }

    document.getElementById('btn-zoom-in').addEventListener('click', () => {
      scale = Math.min(scale * 1.2, 3.5);
      updateTransform();
    });
    document.getElementById('btn-zoom-out').addEventListener('click', () => {
      scale = Math.max(scale / 1.2, 0.3);
      updateTransform();
    });
    document.getElementById('btn-reset').addEventListener('click', () => {
      scale = 1;
      translateX = 0;
      translateY = 0;
      updateTransform();
    });

    container.addEventListener('wheel', (e) => {
      e.preventDefault();
      const zoomFactor = e.deltaY < 0 ? 1.1 : 0.9;
      const newScale = Math.min(Math.max(scale * zoomFactor, 0.3), 3.5);

      const rect = svg.getBoundingClientRect();
      const mouseX = e.clientX - rect.left;
      const mouseY = e.clientY - rect.top;

      translateX = mouseX - (mouseX - translateX) * (newScale / scale);
      translateY = mouseY - (mouseY - translateY) * (newScale / scale);
      scale = newScale;

      updateTransform();
    }, { passive: false });

    container.addEventListener('mousedown', (e) => {
      if (e.button !== 0) return;
      isPanning = true;
      startX = e.clientX - translateX;
      startY = e.clientY - translateY;
    });

    window.addEventListener('mousemove', (e) => {
      if (!isPanning) return;
      translateX = e.clientX - startX;
      translateY = e.clientY - startY;
      updateTransform();
    });

    window.addEventListener('mouseup', () => {
      isPanning = false;
    });
  </script>
