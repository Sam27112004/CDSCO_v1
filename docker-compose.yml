services:
  db:
    image: postgres:15-alpine
    container_name: cdsco-postgres-app
    restart: always
    environment:
      POSTGRES_USER: cdsco_user
      POSTGRES_PASSWORD: cdsco_password
      POSTGRES_DB: cdsco_dossier_db
    ports:
      - "${POSTGRES_HOST_PORT:-5434}:5432"
    volumes:
      - cdsco_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cdsco_user -d cdsco_dossier_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: cdsco-backend:latest
    container_name: cdsco-backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://cdsco_user:cdsco_password@db:5432/cdsco_dossier_db
      PORTAL_MODE: DEVELOPMENT
      STORAGE_PROVIDER: local
      LOCAL_STORAGE_PATH: /app/storage
      MAX_FILE_SIZE_BYTES: 10485760
    volumes:
      - cdsco_backend_storage:/app/storage
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: cdsco-frontend:latest
    container_name: cdsco-frontend
    restart: always
    depends_on:
      - backend
    environment:
      BACKEND_INTERNAL_URL: http://backend:8000
    ports:
      - "3000:3000"

volumes:
  cdsco_postgres_data:
  cdsco_backend_storage:
